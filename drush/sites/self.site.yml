# Edit or remove this file as needed.
# Docs at https://github.com/drush-ops/drush/blob/master/examples/example.site.yml
#
# ArgoCD environments (README.md, "ArgoCD deployment"). The shell host is
# <release>-shell.<namespace>, reached through the cluster's SSH jump host; the
# release is the branch (main, production) or pr-<N> for a pull request preview.
# ${NAMESPACE} and ${PROJECT} come from drush/Commands/SiltaAliasAlterCommands.php.
# Change main to master if that is the project's staging branch.

# Staging environment (main branch), on the dev cluster.
main:
  host: main-shell.${NAMESPACE}
  ssh:
    options: -J www-admin@ssh.dev.silta.cloud
  user: www-admin
  root: /app/web
  uri: https://main-${PROJECT}.dev.silta.cloud

# Production environment (production branch, k8s/production/), on the prod cluster.
production:
  host: production-shell.${NAMESPACE}
  ssh:
    options: -J www-admin@ssh.prod.silta.cloud
  user: www-admin
  root: /app/web
  uri: https://production-${PROJECT}.prod.silta.cloud
