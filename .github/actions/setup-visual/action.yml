name: Set up visual regression
description: Check the Silta basic auth secrets, install npm dependencies and Chromium for Playwright.

runs:
  using: composite
  steps:
    # Fail in seconds instead of after the CircleCI wait.
    - name: Check secrets
      shell: bash
      run: |
        if [ -z "${TEST_HTTP_USER:-}" ] || [ -z "${TEST_HTTP_PASS:-}" ]; then
          echo "::error::Repository secrets SILTA_BASICAUTH_USER / SILTA_BASICAUTH_PASS are not set."
          exit 1
        fi

    - uses: actions/setup-node@v6
      with:
        node-version: "24"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: |
        npm ci
        npx playwright install --with-deps chromium
