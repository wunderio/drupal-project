name: "Playwright: End-to-end tests"

# Installs Drupal in DDEV and runs the end-to-end specs in chromium.
# Visual regression runs in its own workflow, visual-regression.yml.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: playwright_e2e
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        run: ddev exec env CI=true npx playwright test --project=chromium

      # Zipped, with traces.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      # On the host (not in DDEV), so the script can write the job summary.
      - uses: actions/setup-node@v6
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        with:
          node-version: "24"

      # The Playwright HTML report as one file (attachments embedded), so it
      # opens in the browser like `npx playwright show-report`.
      - name: Build HTML report
        if: ${{ !cancelled() && hashFiles('playwright-report/index.html') != '' }}
        run: node .github/scripts/playwright-report-html.mjs playwright-report playwright-e2e-report.html

      # Unzipped (archive: false), so the artifact link opens the page directly.
      - name: Upload HTML report
        id: html-report
        if: ${{ !cancelled() && hashFiles('playwright-e2e-report.html') != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: playwright-e2e-report.html
          archive: false
          retention-days: 30

      - name: Link HTML report
        if: steps.html-report.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.html-report.outputs.artifact-url }}
        run: echo "[Open the Playwright report]($REPORT_URL)" >> "$GITHUB_STEP_SUMMARY"
