name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  # Find and download the visual regression baseline artifact.
  actions: read

env:
  # Newest baseline of the visual regression screenshots, taken from main.
  BASELINE_NAME: visual-baseline-main

jobs:
  playwright:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Let all suites finish, so an accessibility failure doesn't cancel e2e.
      fail-fast: false
      matrix:
        include:
          # --project accepts "*" wildcards; each job runs one test type in all its browsers.
          - name: e2e
            project: e2e-*
          - name: accessibility
            project: a11y-*
          - name: visual
            project: visual-*
            visual: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        if: ${{ !matrix.visual }}
        run: ddev exec env CI=true npx playwright test --project="${{ matrix.project }}"

      # --- Visual regression ---------------------------------------------------
      # Pushes to main record the baseline. Pull requests are compared against
      # the newest one, so only changes made by the PR are reported.
      - name: Find baseline
        id: baseline
        if: ${{ matrix.visual && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$BASELINE_NAME&per_page=100" \
            --jq '[.artifacts[] | select(.expired | not)] | max_by(.created_at) | .workflow_run.id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASELINE_NAME" --dir playwright/screenshots
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No baseline yet (first run, or expired): capturing one, nothing is compared."
          fi

      - name: Compare with baseline
        if: ${{ matrix.visual && steps.baseline.outputs.found == 'true' }}
        run: ddev exec env CI=true VISUAL_REGRESSION=1 npx playwright test --project='${{ matrix.project }}'

      - name: Record baseline
        if: ${{ matrix.visual && steps.baseline.outputs.found != 'true' }}
        run: ddev exec env CI=true VISUAL_REGRESSION=1 npx playwright test --project='${{ matrix.project }}' --update-snapshots=all

      - name: Upload baseline
        if: ${{ matrix.visual && github.event_name == 'push' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.BASELINE_NAME }}
          path: playwright/screenshots/
          retention-days: 90

      # The Playwright HTML report as one file (attachments embedded), so it
      # opens in the browser like `npx playwright show-report`.
      - name: Build HTML report
        if: ${{ !cancelled() && hashFiles('playwright/report/index.html') != '' }}
        run: node .github/scripts/playwright-report-html.mjs playwright/report playwright-${{ matrix.name }}-report.html

      # Unzipped (archive: false), so the artifact link opens the page directly.
      - name: Upload HTML report
        id: html-report
        if: ${{ !cancelled() && hashFiles(format('playwright-{0}-report.html', matrix.name)) != '' }}
        uses: actions/upload-artifact@v7
        with:
          path: playwright-${{ matrix.name }}-report.html
          archive: false
          retention-days: 30

      - name: Link HTML report
        if: steps.html-report.outputs.artifact-url != ''
        env:
          REPORT_URL: ${{ steps.html-report.outputs.artifact-url }}
        run: echo "<a href=\"$REPORT_URL\" target=\"_blank\" rel=\"noopener\">Open the ${{ matrix.name }} report</a>" >> "$GITHUB_STEP_SUMMARY"

      # Full report with traces, as a zip.
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright/report/
          retention-days: 30
