name: Playwright Tests

on:
  push:
    # Must include BASELINE_BRANCH (see env below).
    branches: [main]
    # Trying out the visual regression flow on a feature branch (see env below):
    # branches: [main, feature/<branch-name>]
  pull_request:

permissions:
  contents: read
  # Find and download the visual regression baseline artifact.
  actions: read

concurrency:
  # Pushes to main run one at a time, so the newest commit uploads the newest baseline.
  # Pull requests cancel their own superseded runs.
  group: playwright-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Visual regression: the branch whose pushes record the baseline screenshots that pull
  # requests are compared against. Artifact: visual-baseline-<branch>. When changing it,
  # also change `on.push.branches` above (GitHub does not allow variables in triggers).
  BASELINE_BRANCH: main
  # Trying out the visual regression flow before merging: record the baseline on a feature
  # branch and open a draft PR from a branch based on it. TEMPORARY: switch both this and
  # `on.push.branches` back to main before merging, or main never records a baseline again.
  # BASELINE_BRANCH: feature/<branch-name>

jobs:
  playwright:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # --project accepts "*" wildcards; each job runs one test type in all its browsers.
          # `name` is the job and status check name; `id` (optional, no spaces) names the artifacts.
          - name: e2e
            id: e2e
            project: e2e-*
          - name: visual regression
            id: visual
            project: visual-*
            visual: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        if: ${{ !matrix.visual }}
        run: ddev exec env CI=true npx playwright test --project="${{ matrix.project }}"

      # --- Visual regression ---------------------------------------------------
      # Pushes to BASELINE_BRANCH record the baseline. Pull requests are compared
      # against the newest one, so only changes made by the PR are reported.
      - name: Find baseline
        id: baseline
        if: ${{ matrix.visual && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only baselines uploaded by a run on BASELINE_BRANCH of this repository: a pull request
          # (or fork) could change this workflow and upload an artifact with the same name.
          NAME="visual-baseline-$BASELINE_BRANCH"
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$NAME&per_page=100" \
            --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == env.BASELINE_BRANCH
              and .workflow_run.head_repository_id == .workflow_run.repository_id)]
              | max_by(.created_at) | .workflow_run.id // empty')
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir playwright/screenshots
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No baseline from $BASELINE_BRANCH (first run, or expired after 90 days): capturing one, nothing is compared."
          fi

      - name: Compare with baseline
        if: ${{ matrix.visual && steps.baseline.outputs.found == 'true' }}
        run: ddev exec env CI=true npx playwright test --project='${{ matrix.project }}'

      - name: Record baseline
        if: ${{ matrix.visual && steps.baseline.outputs.found != 'true' }}
        run: ddev exec env CI=true npx playwright test --project='${{ matrix.project }}' --update-snapshots=all

      - name: Upload baseline
        if: ${{ matrix.visual && github.event_name == 'push' && github.ref_name == env.BASELINE_BRANCH }}
        uses: actions/upload-artifact@v6
        with:
          name: visual-baseline-${{ env.BASELINE_BRANCH }}
          path: playwright/screenshots/
          retention-days: 90

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.id || matrix.name }}
          path: playwright/report/
          retention-days: 30
