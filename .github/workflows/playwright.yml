name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (standard base + config import)
        run: |
          SITE_UUID=$(sed -nE 's/^uuid:[[:space:]]*//p' config/sync/system.site.yml)
          ddev drush site:install standard --yes --account-pass=admin
          ddev drush config:set system.site uuid "$SITE_UUID" -y
          ddev drush config:import -y

      - name: Run Playwright tests
        run: ddev exec env CI=true npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
