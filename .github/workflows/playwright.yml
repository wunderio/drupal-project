name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The web image's Playwright system deps are pinned in the Dockerfile, which
      # can't read package-lock.json. Fail when an npm bump (e.g. Dependabot) leaves it behind.
      - name: Check Playwright version in Dockerfile
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
          grep -qF "playwright@$v " .ddev/web-build/Dockerfile.playwright \
            || { echo "::error file=.ddev/web-build/Dockerfile.playwright::package-lock.json has Playwright $v, but .ddev/web-build/Dockerfile.playwright does not. Change it to playwright@$v."; exit 1; }

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        run: ddev exec env CI=true npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
