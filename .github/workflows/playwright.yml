name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal
        run: ddev drush site:install --yes --account-pass=admin

      - name: Install Node dependencies
        run: ddev exec npm ci

      - name: Run Playwright e2e tests
        run: ddev exec npm run test:e2e

      - name: Run Playwright accessibility templates
        run: ddev exec npm run test:a11y

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
