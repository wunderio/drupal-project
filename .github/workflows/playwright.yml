name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        run: ddev exec env CI=true npx playwright test --project=chromium

      - name: Publish test results
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: playwright/test-results/junit.xml
          check_name: Playwright test results
          detailed_summary: true
          include_passed: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: playwright/report/
          retention-days: 30
