name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      # Let both suites finish, so an accessibility failure doesn't cancel e2e.
      fail-fast: false
      matrix:
        include:
          - name: e2e
            project: chromium
          - name: accessibility
            project: a11y

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup DDEV
        uses: ddev/github-action-setup-ddev@v1

      - name: Install Drupal (from existing config)
        run: ddev drush site:install --existing-config --yes --account-pass=admin

      - name: Run Playwright tests
        run: ddev exec env CI=true npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.name }}
          path: playwright/report/
          retention-days: 30
