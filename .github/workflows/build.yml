---
# Builds the project's images, pushes them to the container registry and commits the new
# tags to k8s/<overlay>/values/, which ArgoCD then deploys. See README.md, "ArgoCD deployment".
name: Build & Push Images

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "k8s/**"
      - "**.md"
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Read-only default; only update-tags gets contents: write.
permissions:
  contents: read

env:
  # The container registry (README.md, "Setting up a new project"). The image repositories in
  # k8s/*/values/ must point at the same registry.
  REGISTRY: REGISTRY_HOST
  # "true": the production branch's tags are committed to k8s/production/ too, so merging to
  # production releases it. "false": production images are built, their tags set by hand.
  COMMIT_PRODUCTION_TAGS: "true"

jobs:
  # ---------------------------------------------------------------
  # Validate codebase (lint, static analysis, tests).
  # Must pass before any build.
  # ---------------------------------------------------------------
  validate:
    name: Validate
    runs-on: ubuntu-latest
    container:
      image: wunderio/silta-cicd:circleci-php8.4-node24-composer2-v1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: PHP CodeSniffer
        run: |
          if [ -d web/modules/custom ] && [ "$(ls -A web/modules/custom 2>/dev/null)" ]; then
            vendor/bin/phpcs --standard=Drupal,DrupalPractice web/modules/custom
          else
            echo "No custom modules found, skipping PHPCS."
          fi

      # Not blocking yet: once composer installs web/core, ESLint loads core's config, which
      # needs eslint-plugin-jsdoc, and package.json doesn't have it.
      - name: npm lint
        run: |
          npm ci
          npm run lint || true

  # ---------------------------------------------------------------
  # Install production dependencies and build assets.
  # ---------------------------------------------------------------
  build-assets:
    name: Install & Build
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Composer install
        run: |
          composer install \
            --no-dev \
            --no-interaction \
            --optimize-autoloader \
            --prefer-dist
          # Restore execute permissions on all composer bin stubs and their targets.
          find vendor/bin -type f -o -type l | while read -r f; do
            chmod +x "$f"
            [ -L "$f" ] && chmod +x "$(readlink -f "$f")" 2>/dev/null || true
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: npm install & build
        run: |
          npm ci
          npm run build

      - name: Clean up before artifact upload
        run: rm -rf .git node_modules

      - name: Upload built codebase
        uses: pyTooling/upload-artifact@v7
        with:
          name: built-codebase
          include-hidden-files: true
          path: .
          retention-days: 1

  # ---------------------------------------------------------------
  # Resolve the pushed branch to its k8s overlay and compute the image tag.
  # Images are built only for a branch whose overlay exists, the only
  # branches ArgoCD deploys.
  # ---------------------------------------------------------------
  overlay:
    name: Resolve Overlay
    runs-on: ubuntu-latest
    # Images only on push. A pull_request run would build the same commit a second time and
    # race the push run's tag commit, and fork pull requests get no registry secrets; pull
    # requests are validated only. No images from the template repository itself
    # (is_template), so it never deploys: a repository created from the template has
    # is_template false and builds normally.
    if: github.event_name == 'push' && !github.event.repository.is_template
    outputs:
      deploys: ${{ steps.resolve.outputs.deploys }}
      commit: ${{ steps.resolve.outputs.commit }}
      values: ${{ steps.resolve.outputs.values }}
      project: ${{ steps.resolve.outputs.project }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Checkout k8s/
        uses: actions/checkout@v4
        with:
          sparse-checkout: k8s

      # The branch -> overlay mapping of the ArgoCD platform. Other branches (topic branches
      # without k8s/feature/, Dependabot, Renovate) are validated but get no images: nothing
      # would deploy them, and Dependabot runs without the registry secrets.
      - name: Resolve overlay and tag
        id: resolve
        run: |
          case "$GITHUB_REF_NAME" in
            main|master)               overlay=staging ;;
            develop)                   overlay=develop ;;
            production)                overlay=production ;;
            feature/*|hotfix/*|epic/*) overlay=feature ;;
            *)                         overlay="" ;;
          esac
          if [ -z "$overlay" ] || [ ! -f "k8s/$overlay/apps.yaml" ]; then
            echo "deploys=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No k8s overlay for $GITHUB_REF_NAME, so no images are built."
            exit 0
          fi
          commit=true
          if [ "$overlay" = production ] && [ "$COMMIT_PRODUCTION_TAGS" != true ]; then
            commit=false
          fi
          # <branch>-<UTC timestamp>-<short SHA>: one branch's tags sort by build time.
          branch=$(echo "$GITHUB_REF_NAME" | tr '/_' '--' | cut -c1-40)
          repository="${GITHUB_REPOSITORY##*/}"
          {
            echo "deploys=true"
            echo "commit=$commit"
            echo "values=k8s/$overlay/values/drupal.yaml"
            # The registry project, as in the image repositories in k8s/*/values/.
            echo "project=${repository,,}"
            echo "tag=$branch-$(date -u +%Y%m%dT%H%M%S)-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"
          echo "$GITHUB_REF_NAME deploys k8s/$overlay/."

  # ---------------------------------------------------------------
  # Build and push the images.
  # ---------------------------------------------------------------
  build-images:
    name: Build & Push — ${{ matrix.image.name }}
    runs-on: ubuntu-latest
    needs: [build-assets, overlay]
    # Only for a branch whose overlay exists (the overlay job). update-tags commits with
    # "[skip ci]", so it never retriggers. Skipping this job also skips update-tags, which needs it.
    if: needs.overlay.outputs.deploys == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image:
          - name: php
            dockerfile: silta/php.Dockerfile
          - name: nginx
            dockerfile: silta/nginx.Dockerfile
          - name: shell
            dockerfile: silta/shell.Dockerfile
    steps:
      - name: Download built codebase
        uses: pyTooling/download-artifact@v4
        with:
          name: built-codebase

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Harbor only accepts pushes to an existing project, so the first build creates it, with
      # vulnerability scan and SBOM on push. Other registries: remove this step.
      - name: Create the Harbor project
        env:
          PROJECT: ${{ needs.overlay.outputs.project }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          api="https://$REGISTRY/api/v2.0/projects"
          if curl -sf -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" "$api?name=$PROJECT" | grep -q '"project_id"'; then
            echo "Project $PROJECT exists."
          elif curl -sf -X POST -u "$REGISTRY_USERNAME:$REGISTRY_PASSWORD" -H "Content-Type: application/json" "$api" \
            -d "{\"project_name\":\"$PROJECT\",\"metadata\":{\"public\":\"false\",\"auto_scan\":\"true\",\"auto_sbom_generation\":\"true\"}}"
          then
            echo "Created project $PROJECT."
          else
            echo "::warning::Could not create project $PROJECT; the push fails if it does not exist."
          fi

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          pull: true
          push: true
          tags: ${{ env.REGISTRY }}/${{ needs.overlay.outputs.project }}/${{ matrix.image.name }}:${{ needs.overlay.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image.name }}
          cache-to: type=gha,scope=${{ matrix.image.name }},mode=max

  # ---------------------------------------------------------------
  # Commit the new image tags to the values file of the branch's
  # overlay. ArgoCD deploys that commit.
  # ---------------------------------------------------------------
  update-tags:
    name: Update Image Tags
    runs-on: ubuntu-latest
    needs: [overlay, build-images]
    if: needs.overlay.outputs.commit == 'true'
    permissions:
      contents: write
    steps:
      # A GitHub App token lets the tag commit pass branch protection (README.md).
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ARGOCD_APP_ID }}
          private-key: ${{ secrets.ARGOCD_APP_PRIVATE_KEY }}

      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Set image tags
        id: update
        env:
          VALUES: ${{ needs.overlay.outputs.values }}
          TAG: ${{ needs.overlay.outputs.tag }}
          # yq paths of the image tags in the values file.
          TAG_PATHS: .php.image.tag .nginx.image.tag .shell.image.tag
        run: |
          updated=false
          for path in $TAG_PATHS; do
            current=$(yq e "$path" "$VALUES")
            # A run that finishes after a newer one of the same branch must not roll back.
            if [ "${current%-*-*}" = "${TAG%-*-*}" ] && [[ ! "$current" < "$TAG" ]]; then
              echo "$path: $current is not older than $TAG, keeping it."
              continue
            fi
            echo "$path: $current -> $TAG"
            yq e -i "$path = strenv(TAG)" "$VALUES"
            updated=true
          done
          echo "updated=$updated" >> "$GITHUB_OUTPUT"

      # Committed through the API, not git push: GitHub signs the commit and attributes it to
      # the App, and expectedHeadOid fails the commit if the branch moved since checkout.
      - name: Commit image tags
        if: steps.update.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VALUES: ${{ needs.overlay.outputs.values }}
        run: |
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$GITHUB_REF_NAME" \
            --arg head "$(git rev-parse HEAD)" \
            --arg path "$VALUES" \
            --arg contents "$(base64 -w0 "$VALUES")" \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: { input: {
                branch: { repositoryNameWithOwner: $repo, branchName: $branch },
                expectedHeadOid: $head,
                message: { headline: "ci: update image tags [skip ci]" },
                fileChanges: { additions: [{ path: $path, contents: $contents }] }
              } }
            }' | gh api graphql --input - --jq '"Committed " + .data.createCommitOnBranch.commit.oid'
