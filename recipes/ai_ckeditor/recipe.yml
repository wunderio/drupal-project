name: 'AI CKEditor assistant'
description: 'Adds the AI tools button and the text selection menu to the Basic HTML and Full HTML editors. The tools use the default AI chat provider (see the ai_mirai recipe). Creates "Tone of voice" and "Translation languages" vocabularies with starter terms for the tone and translate tools.'
type: 'AI'
install:
  - taxonomy
  - ai_ckeditor
config:
  # Recipes skip module default config entities unless imported explicitly.
  # Without this the AI prompts are missing and every tool sends an empty prompt.
  import:
    ai_ckeditor: '*'
  actions:
    taxonomy.vocabulary.ai_tone:
      createIfNotExists:
        name: 'Tone of voice'
        description: 'Tones for the AI CKEditor tone tool. The term description tells the AI how to write.'
    taxonomy.vocabulary.ai_translation_languages:
      createIfNotExists:
        name: 'Translation languages'
        description: 'Target languages for the AI CKEditor translate tool.'
    user.role.content_editor:
      grantPermission: 'use ai ckeditor'
    editor.editor.basic_html: &ai_ckeditor_editor
      addItemToToolbar:
        - aickeditor
        - ai_balloon_menu
      setProperties:
        settings.plugins.ai_ckeditor_ai:
          dialog:
            autoresize: 'min-width: 600px'
            height: '750'
            width: '900'
            dialog_class: ai-ckeditor-modal
          # An empty provider uses the default chat provider from ai.settings.
          plugins:
            ai_ckeditor_completion:
              enabled: true
              provider: null
            ai_ckeditor_help:
              enabled: true
            ai_ckeditor_modify_prompt:
              enabled: true
              provider: null
            ai_ckeditor_reformat_html:
              enabled: true
              provider: null
            ai_ckeditor_spellfix:
              enabled: true
              provider: null
            ai_ckeditor_summarize:
              enabled: true
              provider: null
            ai_ckeditor_tone:
              enabled: true
              provider: null
              autocreate: false
              tone_vocabulary: ai_tone
              use_description: true
            ai_ckeditor_translate:
              enabled: true
              provider: null
              language_source: tax
              autocreate: false
              translate_vocabulary: ai_translation_languages
              use_description: false
    editor.editor.full_html: *ai_ckeditor_editor
