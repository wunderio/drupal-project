name: drupal-project
type: drupal11
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "11.4"
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "24"
# Prevents DDEV from managing settings.php and other Drupal settings files.
disable_settings_management: true
web_environment:
  - DB_NAME=db
  - DB_USER=db
  - DB_PASS=db
  - DB_HOST=db
  - DRUSH_OPTIONS_URI=https://drupal-project.ddev.site
  - DRUPAL_TEST_DRUPAL_ROOT=/var/www/html/web
  - TEST_BASE_URL=http://web:80
  - ENVIRONMENT_NAME=ddev
  - EXEC_GRUMPHP_COMMAND=ddev php
  - HASH_SALT=notsosecurehash
  - ELASTICSEARCH_HOST=elasticsearch
  - VARNISH_ADMIN_HOST=varnish
  - VARNISH_ADMIN_PORT=80
  - SMTP_ADDRESS=localhost:1025
  # Persistent DDEV volume: survives `ddev stop` (which removes containers) and
  # isn't synced to the host by Mutagen. System deps: .ddev/web-build/Dockerfile.playwright
  - PLAYWRIGHT_BROWSERS_PATH=/mnt/ddev-global-cache/ms-playwright

corepack_enable: false
hooks:
  post-start:
    # Skip expensive installs when the environment is already set up (see #478).
    # Composer is handled once by wunderio/ddev-wunderio-drupal (web-post-start-once).
    # Re-run manually after dependency changes: ddev npm ci
    - exec: |
        if [ ! -d node_modules ]; then
          echo "node_modules/ missing — running npm ci..."
          npm ci
        else
          echo "node_modules/ present — skipping npm ci"
        fi
    # Warn when the Playwright version in the web image (system deps) differs from
    # package-lock.json. The Dockerfile can't read the lock file because DDEV's
    # build context is limited to .ddev/web-build/.
    - exec: |
        v=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")
        grep -qF "playwright@$v " /mnt/ddev_config/web-build/Dockerfile.playwright \
          || printf '\n\033[1;31m%s\n%s\n%s\n%s\033[0m\n\n' \
            "!!! WARNING: Playwright version mismatch !!!" \
            "package-lock.json has Playwright $v, but .ddev/web-build/Dockerfile.playwright does not." \
            "Update the playwright@ version in the Dockerfile to $v and run 'ddev restart'." \
            "Until then the web image has system libraries for an older Playwright version."
    # No-op when the browsers for the installed Playwright version are present;
    # downloads new builds automatically after a Playwright version bump.
    # All browsers from playwright.config.ts; deps are in .ddev/web-build/Dockerfile.playwright.
    - exec: "npx playwright install"
    - exec-host: |
        # Run the Elasticsearch plugin setup script
        ddev exec -s elasticsearch /mnt/ddev_config/elasticsearch/elasticsearch-setup.sh

        # Check for the restart marker file
        if [ -f .ddev/elasticsearch/restart_needed ]; then
          echo "Elasticsearch plugins installed. Restarting elasticsearch container..."
          docker restart ddev-${DDEV_SITENAME}-elasticsearch
          rm .ddev/elasticsearch/restart_needed
        fi
