name: drupal-project
type: drupal11
docroot: web
php_version: "8.4"
webserver_type: nginx-fpm
xdebug_enabled: false
additional_hostnames: []
additional_fqdns: []
database:
  type: mariadb
  version: "11.4"
use_dns_when_possible: true
composer_version: "2"
nodejs_version: "24"
# Prevents DDEV from managing settings.php and other Drupal settings files.
disable_settings_management: true
web_environment:
  - DB_NAME=db
  - DB_USER=db
  - DB_PASS=db
  - DB_HOST=db
  - DRUSH_OPTIONS_URI=https://drupal-project.ddev.site
  - DRUPAL_TEST_DRUPAL_ROOT=/var/www/html/web
  - TEST_BASE_URL=http://web:80
  - ENVIRONMENT_NAME=ddev
  - EXEC_GRUMPHP_COMMAND=ddev php
  - HASH_SALT=notsosecurehash
  - ELASTICSEARCH_HOST=elasticsearch
  - VARNISH_ADMIN_HOST=varnish
  - VARNISH_ADMIN_PORT=80
  - SMTP_ADDRESS=localhost:1025

corepack_enable: false
hooks:
  post-start:
    # Skip expensive installs when the environment is already set up (see #478).
    # Composer is handled once by wunderio/ddev-wunderio-drupal (web-post-start-once).
    # Re-run manually after dependency changes: ddev npm ci,
    # ddev npx playwright install --with-deps
    - exec: |
        if [ ! -d node_modules ]; then
          echo "node_modules/ missing — running npm ci..."
          npm ci
        else
          echo "node_modules/ present — skipping npm ci"
        fi
    - exec: |
        if [ ! -d "$HOME/.cache/ms-playwright" ]; then
          echo "Playwright browser cache missing — running playwright install --with-deps..."
          npx playwright install --with-deps
        else
          echo "Playwright browser cache present — skipping playwright install"
        fi
    - exec-host: |
        # Run the Elasticsearch plugin setup script
        ddev exec -s elasticsearch /mnt/ddev_config/elasticsearch/elasticsearch-setup.sh

        # Check for the restart marker file
        if [ -f .ddev/elasticsearch/restart_needed ]; then
          echo "Elasticsearch plugins installed. Restarting elasticsearch container..."
          docker restart ddev-${DDEV_SITENAME}-elasticsearch
          rm .ddev/elasticsearch/restart_needed
        fi
